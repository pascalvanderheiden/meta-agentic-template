# Dogfoods APM distribution for this meta-agentic template.
# apm.lock.yaml is generated by `apm install`; do not hand-write it.
name: meta-agentic-template
version: 0.1.0
description: Meta-agentic GitHub Copilot template artifacts for existing repos.
author: Pascal van der Heiden
license: MIT
repository: https://github.com/pascalvanderheiden/meta-agentic-template

# Bundled local primitives for APM path installs from this repo:
# prompts, instructions, squad.agent.md, meta-agentic-method, progress-report, github-issues, repo-wiki.
# repo-wiki is local; do not declare it as an external dependency.
dependencies:
  apm:
    # Source for the bundled github-issues skill used by the upstream feedback loop.
    - github/awesome-copilot/skills/github-issues
    # candidates (verify before enabling): external sources for find-skills, mcp-builder, skill-creator
  mcp:
    # GitHub-hosted MCP endpoint; transport is the MCP transport name, not URL scheme.
    - name: io.github.github/github-mcp-server
      transport: http
    # Verified in the MCP registry; resolves to the @playwright/mcp local package.
    - microsoft/playwright-mcp
